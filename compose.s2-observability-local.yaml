# Entorno local efímero de S2. Proyecto independiente; no lee .env ni usa servicios remotos.
name: melt-s2-observability

services:
  gateway:
    image: nginx:1.28-alpine-otel
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      catalogo-profesionales:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - melt_s2
    restart: unless-stopped

  catalogo-profesionales:
    build:
      context: ./services/catalogo-profesionales
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
      CATALOGO_MONGODB_DATABASE: melt_s2_catalogo
      PROFESIONALES_MONGODB_DATABASE: melt_s2_profesionales
      PORT: "8081"
      AUTH_URL: http://127.0.0.1:9
      MELT_INTERNAL_KEY: melt-s2-local-placeholder-not-a-secret
      OPENSEARCH_URL: http://opensearch:9200
      MEMCACHED_ADDRESS: memcached:11211
      MEMCACHED_NAMESPACE: melt:s2:catalogo
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      memcached:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - melt_s2
    restart: unless-stopped
    deploy:
      replicas: 2

  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - melt_s2
    restart: unless-stopped

  mongo-init:
    image: mongo:7
    entrypoint: ["mongosh", "--host", "mongodb:27017", "--quiet", "--eval"]
    command:
      - 'try { rs.status(); } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}); }'
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - melt_s2
    restart: "no"

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - melt_s2
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    command: ["memcached", "-m", "64"]
    networks:
      - melt_s2
    restart: unless-stopped

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.11.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./infra/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    networks:
      - melt_s2
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      melt_s2:
        aliases:
          - prometheus-internal
      local_access: {}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: melt_s2_local
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning/datasources/prometheus.s2-local.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./infra/grafana/provisioning/dashboards/melt.yml:/etc/grafana/provisioning/dashboards/melt.yml:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - melt_s2
      - local_access
    restart: unless-stopped

  gateway-access:
    image: nginx:1.28-alpine-otel
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 8080;
          location / {
            proxy_pass http://gateway:80;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
        }
        EOF
        exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:18082:8080"
    networks:
      - melt_s2
      - local_access
    restart: unless-stopped

  jaeger-access:
    image: nginx:1.28-alpine-otel
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 8080;
          location / {
            proxy_pass http://jaeger:16686;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
        }
        EOF
        exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:16687:8080"
    networks:
      - melt_s2
      - local_access
    restart: unless-stopped

networks:
  melt_s2:
    name: melt-s2-observability_internal
    internal: true
  local_access:
    name: melt-s2-observability_access
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
