# Override exclusivamente local: reemplaza Atlas/Supabase por bases descartables.
# Usar junto con compose.yaml y .env.local; nunca para desplegar.
services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "melt-local", "--bind_ip_all"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'if (db.hello().isWritablePrimary) quit(0);
          try { rs.initiate({_id:"melt-local",members:[{_id:0,host:"mongodb:27017"}]}) }
          catch (e) {}; quit(1)'
      interval: 3s
      timeout: 10s
      retries: 40
    volumes:
      - melt_local_mongo_data:/data/db

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: melt-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - melt_local_postgres_data:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sh:/docker-entrypoint-initdb.d/00-melt-init.sh:ro
      - ./infra/supabase/reservas.sql:/melt-schemas/reservas.sql:ro
      - ./infra/supabase/beneficios.sql:/melt-schemas/beneficios.sql:ro

  catalogo-profesionales:
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=melt-local
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      replicas: 1

  auth:
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=melt-local
    depends_on:
      mongodb:
        condition: service_healthy

  pagos:
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=melt-local
      MP_TEST_ACCESS_TOKEN: ""
      MP_WEBHOOK_SECRET: ""
    depends_on:
      mongodb:
        condition: service_healthy

  reservas:
    environment:
      RESERVAS_DATABASE_URL: postgres://postgres:melt-local@postgres:5432/reservas?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  beneficios:
    environment:
      BENEFICIOS_DATABASE_URL: postgres://postgres:melt-local@postgres:5432/beneficios?sslmode=disable
      GHOSTKITCHEN_API_KEY: ${GHOSTKITCHEN_API_KEY:-}
      GHOSTKITCHEN_BASE_URL: ${GHOSTKITCHEN_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  melt_local_mongo_data:
  melt_local_postgres_data:
