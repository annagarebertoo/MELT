name: Go CI

on:
  push:
    branches:
      - main
      - docs/correcciones-reglas-negocio
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_TEST_MONGODB_URI: mongodb://localhost:27017
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/catalogo-profesionales
          - services/reservas
          - services/beneficios
          - services/auth
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - name: Normalizar y descargar dependencias
        run: |
          go mod tidy
          go mod download
      - name: Ejecutar pruebas
        run: go test -race ./...
      - name: Compilar servicio
        run: go build ./...
