global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: catalogo-profesionales
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
    dns_sd_configs:
      - names: ["catalogo-profesionales"]
        type: A
        port: 8081
        refresh_interval: 15s
