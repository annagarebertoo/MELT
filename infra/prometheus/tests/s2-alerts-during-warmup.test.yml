rule_files:
  - ../alerts.yml

evaluation_interval: 15s

tests:
  - name: replica-and-5xx-alerts-remain-independent-during-slo-warmup
    interval: 15s
    input_series:
      - series: 'up{job="catalogo-profesionales", instance="catalogo-1"}'
        values: '1+0x40'
      - series: 'up{job="catalogo-profesionales", instance="catalogo-2"}'
        values: '0+0x40'
      - series: 'catalog_http_requests_total{job="catalogo-profesionales", instance="catalogo-1", method="GET", route="/health", status="500", replica="catalogo-1"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: CatalogReplicaUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              service: catalogo-profesionales
            exp_annotations:
              summary: "Una o más réplicas de Catálogo no están disponibles"
              description: "Prometheus observa menos de dos réplicas saludables durante al menos un minuto."
      - eval_time: 10m
        alertname: CatalogHttp5xxBurst
        exp_alerts:
          - exp_labels:
              severity: warning
              service: catalogo-profesionales
            exp_annotations:
              summary: "Catálogo registró errores HTTP 5xx"
              description: "Se observaron al menos tres respuestas 5xx en cinco minutos, sostenidas durante un minuto."
      - eval_time: 10m
        alertname: CatalogReplicaAvailabilitySLOBreach
        exp_alerts: []
