map $http_x_request_id $melt_request_id {
    default $request_id;
    "~^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$" $http_x_request_id;
}

map $uri $melt_route {
    default "unmatched";
    /health "/health";
    /api/v1/auth/registro "/api/v1/auth/registro";
    /api/v1/auth/login "/api/v1/auth/login";
    /api/v1/auth/me "/api/v1/auth/me";
    /api/v1/beneficios/mis-puntos "/api/v1/beneficios/mis-puntos";
    ~^/api/v1/tratamientos(?:/[^/]+)?$ "/api/v1/tratamientos";
}

limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_register:10m rate=5r/m;

map $status $melt_log_level {
    default "INFO";
    ~^4 "WARN";
    ~^5 "ERROR";
}

log_format melt_json escape=json
    '{"timestamp":"$time_iso8601","level":"$melt_log_level",'
    '"service":"melt-gateway","method":"$request_method","route":"$melt_route",'
    '"status":$status,"duration_seconds":$request_time,"request_id":"$melt_request_id",'
    '"upstream":"$upstream_addr"}';

access_log /var/log/nginx/access.log melt_json;

server {
    listen 10000;
    server_name _;

    add_header X-Request-ID $melt_request_id always;
    proxy_hide_header X-Request-ID;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"servicio":"melt-gateway","estado":"ok"}';
    }

    location = /_auth_check {
        internal;
        proxy_pass https://melt-tygp.onrender.com/verify;
        proxy_ssl_server_name on;
        proxy_set_header Host melt-tygp.onrender.com;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-ID $melt_request_id;
    }

    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        rewrite ^/api/v1/auth/(.*)$ /$1 break;
        proxy_pass https://melt-tygp.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host melt-tygp.onrender.com;
        proxy_set_header X-Request-ID $melt_request_id;
    }

    location = /api/v1/auth/registro {
        limit_req zone=auth_register burst=3 nodelay;
        rewrite ^/api/v1/auth/(.*)$ /$1 break;
        proxy_pass https://melt-tygp.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host melt-tygp.onrender.com;
        proxy_set_header X-Request-ID $melt_request_id;
    }

    location /api/v1/auth/ {
        rewrite ^/api/v1/auth/(.*)$ /$1 break;
        proxy_pass https://melt-tygp.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host melt-tygp.onrender.com;
        proxy_set_header X-Request-ID $melt_request_id;
    }

    location /api/v1/beneficios/ {
        auth_request /_auth_check;
        auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
        auth_request_set $auth_user_roles $upstream_http_x_auth_user_roles;
        auth_request_set $auth_user_email $upstream_http_x_auth_user_email;

        rewrite ^/api/v1/beneficios/(.*)$ /$1 break;
        proxy_pass https://melt-beneficios.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host melt-beneficios.onrender.com;
        proxy_set_header X-Auth-User-ID $auth_user_id;
        proxy_set_header X-Auth-User-Roles $auth_user_roles;
        proxy_set_header X-Auth-User-Email $auth_user_email;
        proxy_set_header X-Request-ID $melt_request_id;
    }

    location /api/v1/tratamientos {
        

        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass https://melt-catalogo.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host melt-catalogo.onrender.com;
        proxy_set_header X-Request-ID $melt_request_id;
    }
}
