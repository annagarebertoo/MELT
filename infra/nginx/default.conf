# Correlation IDs are bounded and safe to echo and serialize in logs.
map $http_x_request_id $melt_request_id {
    default $request_id;
    "~^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$" $http_x_request_id;
}

# Avoid query strings and concrete resource identifiers in access logs.
map $uri $melt_route {
    default "unmatched";
    /health "/health";
    /api/v1/catalogo/health "/api/v1/catalogo/health";
    /health/ "/health/";
    /api/v1/catalogo/tratamientos "/api/v1/catalogo/tratamientos";
    ~^/api/v1/catalogo/tratamientos/ "/api/v1/catalogo/tratamientos/:id";
    /tratamientos "/api/v1/catalogo/tratamientos";
    ~^/tratamientos/ "/api/v1/catalogo/tratamientos/:id";
}

map $status $melt_log_level {
    default "INFO";
    ~^4 "WARN";
    ~^5 "ERROR";
}

log_format melt_json escape=json
    '{"timestamp":"$time_iso8601","level":"$melt_log_level",'
    '"service":"melt-gateway","method":"$request_method","route":"$melt_route",'
    '"status":$status,"duration_seconds":$request_time,"request_id":"$melt_request_id",'
    '"trace_id":"$otel_trace_id","span_id":"$otel_span_id","upstream":"$upstream_addr"}';

access_log /var/log/nginx/access.log melt_json;
otel_exporter {
    endpoint jaeger:4317;
    interval 1s;
}
otel_service_name melt-gateway;

resolver 127.0.0.11 valid=5s ipv6=off;

upstream catalogo_backend {
    zone catalogo_backend 64k;
    server catalogo-profesionales:8081 resolve;
    keepalive 32;
}

upstream reservas_backend {
    zone reservas_backend 64k;
    server reservas:8082 resolve;
    keepalive 16;
}

upstream beneficios_backend {
    zone beneficios_backend 64k;
    server beneficios:8083 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    add_header X-Request-ID $melt_request_id always;
    add_header X-Trace-ID $otel_trace_id always;
    proxy_hide_header X-Request-ID;
    proxy_hide_header X-Trace-ID;

    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"servicio":"melt-gateway","estado":"ok"}';
    }

    location /api/v1/catalogo/ {
        otel_trace on;
        otel_trace_context propagate;
        otel_span_name "HTTP catalogo";
        otel_span_attr request.id $melt_request_id;
        otel_span_attr url.path $melt_route;
        rewrite ^/api/v1/catalogo/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $melt_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://catalogo_backend;
    }

    location /api/v1/reservas/ {
        rewrite ^/api/v1/reservas/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $melt_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://reservas_backend;
    }

    location /api/v1/beneficios/ {
        rewrite ^/api/v1/beneficios/(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $melt_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://beneficios_backend;
    }
}
