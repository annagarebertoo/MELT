# Local D11 only: OTLP receiver and query UI in a single process.
extensions:
  jaeger_storage:
    backends:
      local:
        memory:
          max_traces: 10000
  jaeger_query:
    storage:
      traces: local
    http:
      endpoint: 0.0.0.0:16686

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  attributes/privacy:
    actions:
      # NGINX's native module includes the raw URL and user agent by default.
      # Remove these before storage rather than trusting user-supplied values.
      - key: http.target
        action: delete
      - key: http.user_agent
        action: delete
      - key: net.sock.peer.addr
        action: delete
      - key: db.query.text
        action: delete
      - key: db.statement
        action: delete
  batch:
    timeout: 1s

exporters:
  jaeger_storage_exporter:
    trace_storage: local

service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/privacy, batch]
      exporters: [jaeger_storage_exporter]
