name: melt

services:
  gateway:
    image: nginx:1.28-alpine-otel
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - catalogo-profesionales
      - reservas
      - beneficios
      - jaeger
    restart: unless-stopped

  catalogo-profesionales:
    build:
      context: ./services/catalogo-profesionales
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      PORT: "8081"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      replicas: 2
    restart: unless-stopped

  # D11: collector and trace query UI. No business database volumes are changed.
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.11.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    ports:
      - "127.0.0.1:16686:16686"
    volumes:
      - ./infra/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    restart: unless-stopped

  reservas:
    build:
      context: ./services/reservas
    environment:
      PORT: "8082"
    restart: unless-stopped

  beneficios:
    build:
      context: ./services/beneficios
    environment:
      PORT: "8083"
      MONGODB_URI: mongodb://mongodb:27017
      CODIGO_GIMNASIO: ${CODIGO_GIMNASIO:-}
      CLAVE_API_GIMNASIO: ${CLAVE_API_GIMNASIO:-}
      PUNTOS_POR_PLAN_MEMBRESIA: ${PUNTOS_POR_PLAN_MEMBRESIA:-}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - melt_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: melt
      POSTGRES_USER: melt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-melt_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - melt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melt -d melt"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - melt_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    command: ["memcached", "-m", "64", "-vv"]
    ports:
      - "11211:11211"
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - melt_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_dev_only}
    volumes:
      - melt_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  melt_mongodb_data:
  melt_postgres_data:
  melt_rabbitmq_data:
  melt_opensearch_data:
  melt_grafana_data:
